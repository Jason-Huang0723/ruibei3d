<title>瑞北國小平面圖</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: a drafting table — the drawing sheet fills the left, the review list (blue-pencil questions) docks on the right; on phones the list stacks under the sheet. */
:root{
  --paper:#e9eeee; --sheet:#fbfcfb; --ink:#1b2428; --ink2:#56646b; --ink3:#8b979c; --rule:#d3dadb; --field:#ffffff;
  --poche:#263035; --blue:#2a66a8; --blue-soft:rgba(42,102,168,.10); --blue-ink:#ffffff;
  --red:#cc3a27; --green:#2b8653; --black:#1b2428; --amber:#b5730c;
  --t-class:#dfeaf7; --t-sleep:#e9e3f6; --t-staff:#f7ead2; --t-life:#ddefe3; --t-hall:#f0e4de; --t-stage:#eee2cb; --t-danger:#fbe0c6;
  --grass:#dfecd4; --clay:#efd9c9; --court:#d5e5e1; --road:#dfe3e4; --bld:#cfd7da;
  --shadow:0 1px 2px rgba(20,32,38,.08),0 6px 20px rgba(20,32,38,.07);
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Noto Sans CJK TC",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f1416; --sheet:#151b1e; --ink:#e2e8ea; --ink2:#a0adb3; --ink3:#6f7c82; --rule:#283236; --field:#1b2226;
  --poche:#c9d3d7; --blue:#6fa8e8; --blue-soft:rgba(111,168,232,.14); --blue-ink:#0f1416;
  --red:#ff6a55; --green:#58c98a; --black:#e2e8ea; --amber:#e3a33c;
  --t-class:#1b2938; --t-sleep:#251f3a; --t-staff:#33281a; --t-life:#182d22; --t-hall:#2c221e; --t-stage:#2e2719; --t-danger:#3a2617;
  --grass:#1a2a1b; --clay:#33231b; --court:#182a27; --road:#20272a; --bld:#2a3337;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f1416; --sheet:#151b1e; --ink:#e2e8ea; --ink2:#a0adb3; --ink3:#6f7c82; --rule:#283236; --field:#1b2226;
  --poche:#c9d3d7; --blue:#6fa8e8; --blue-soft:rgba(111,168,232,.14); --blue-ink:#0f1416;
  --red:#ff6a55; --green:#58c98a; --black:#e2e8ea; --amber:#e3a33c;
  --t-class:#1b2938; --t-sleep:#251f3a; --t-staff:#33281a; --t-life:#182d22; --t-hall:#2c221e; --t-stage:#2e2719; --t-danger:#3a2617;
  --grass:#1a2a1b; --clay:#33231b; --court:#182a27; --road:#20272a; --bld:#2a3337;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.3); color-scheme:dark}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100%}
@media (min-width:901px){body{height:100%;overflow:hidden}}
button,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 24px;padding-block:14px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top h1{margin:0;font-size:22px;font-weight:900;letter-spacing:.02em;text-wrap:balance}
.top .meta{margin:2px 0 0;color:var(--ink2);font-size:13px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.tabs button{border:1px solid var(--rule);background:var(--sheet);padding:6px 12px;border-radius:7px;font-size:14px;font-weight:500;color:var(--ink2)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.tabs .cnt{font-family:var(--mono);font-size:11px;margin-left:5px;opacity:.75}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:14px;padding-block:0 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));flex:1;min-height:0}
.board{display:flex;flex-direction:column;min-width:0;min-height:0;gap:8px}
.sheet{position:relative;flex:1;min-height:0;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;overflow:hidden;box-shadow:var(--shadow);touch-action:none}
.sheet svg{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none}
.sheet[data-tool="pan"] svg{cursor:grab}.sheet[data-tool="pen"] svg{cursor:crosshair}.sheet[data-tool="text"] svg{cursor:text}.sheet[data-tool="erase"] svg{cursor:cell}
.tags{position:absolute;inset:0;pointer-events:none}
.tag{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;min-width:26px;height:26px;padding:0 6px;border-radius:13px;border:2px solid var(--blue);background:var(--sheet);color:var(--blue);font:600 13px/22px var(--mono);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.tag.on{background:var(--blue);color:var(--blue-ink)}
.tag.done{border-style:dashed;opacity:.75}
.note-in{position:absolute;z-index:3;min-width:180px;padding:5px 8px;border:2px solid var(--red);border-radius:6px;background:var(--field);font-size:15px}
.hint{position:absolute;left:10px;bottom:10px;max-width:calc(100% - 20px);padding:4px 10px;border-radius:6px;background:color-mix(in srgb,var(--sheet) 88%,transparent);border:1px solid var(--rule);font-size:12.5px;color:var(--ink2);pointer-events:none}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--sheet)}
.seg button{border:0;background:transparent;padding:7px 12px;font-size:14px;font-weight:500;color:var(--ink2)}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.sw{display:inline-flex;gap:6px;align-items:center;padding:0 4px}
.sw button{width:26px;height:26px;border-radius:50%;border:2px solid var(--sheet);box-shadow:0 0 0 1px var(--rule)}
.sw button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.sw [data-c="r"]{background:var(--red)}.sw [data-c="g"]{background:var(--green)}.sw [data-c="k"]{background:var(--black)}
.btn{border:1px solid var(--rule);background:var(--sheet);padding:7px 11px;border-radius:8px;font-size:14px;font-weight:500;color:var(--ink2)}
.btn:disabled{opacity:.45;cursor:default}
.save{margin-left:auto;font-size:12.5px;color:var(--ink3)}
.save[data-s="ro"],.save[data-s="local"],.save[data-s="err"]{color:var(--amber)}
.panel{min-width:0;overflow:auto;display:flex;flex-direction:column;gap:12px;padding-bottom:8px}
.intro{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:14px 16px}
.intro h2{margin:0 0 4px;font-size:17px;font-weight:700}
.intro p{margin:0;color:var(--ink2);font-size:14px}
.intro b{color:var(--blue);font-weight:700}
.prog{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.prog .bar{flex:1;height:6px;border-radius:3px;background:var(--rule);overflow:hidden}.prog .bar i{display:block;height:100%;width:0;background:var(--blue);transition:width .3s}
.filters{display:flex;gap:6px;margin-top:10px}
.filters button{border:1px solid var(--rule);background:transparent;border-radius:14px;padding:2px 11px;font-size:13px;color:var(--ink2)}
.filters button[aria-pressed="true"]{border-color:var(--blue);color:var(--blue);background:var(--blue-soft)}
.qs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.q{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.q.on{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.qh{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:10px 12px;text-align:left}
.num{display:inline-grid;place-items:center;min-width:26px;height:26px;border-radius:13px;border:2px solid var(--blue);color:var(--blue);font:600 13px var(--mono)}
.q.on .num{background:var(--blue);color:var(--blue-ink)}
.qt{font-weight:700;font-size:15px;line-height:1.35}
.qt small{display:block;font-weight:400;font-size:12px;color:var(--ink3)}
.st{font-size:12px;padding:1px 8px;border-radius:10px;border:1px solid var(--rule);color:var(--ink3);white-space:nowrap}
.st[data-s="ok"]{border-color:var(--green);color:var(--green)}
.st[data-s="fix"]{border-color:var(--red);color:var(--red)}
.st[data-s="unsure"]{border-color:var(--amber);color:var(--amber)}
.st[data-s="note"]{border-color:var(--blue);color:var(--blue)}
.qb{padding:0 14px 14px 48px;display:flex;flex-direction:column;gap:10px}
.qb .now{margin:0;font-size:14px;color:var(--ink2)}
.qb .now b{display:block;font-size:12px;letter-spacing:.06em;color:var(--ink3);font-weight:500}
.qb ul{margin:0;padding-left:18px;font-size:14px}
.qb ul li::marker{color:var(--blue)}
.ans{display:flex;flex-wrap:wrap;gap:6px}
.ans button{border:1px solid var(--rule);background:transparent;border-radius:8px;padding:5px 10px;font-size:13.5px;color:var(--ink2)}
.ans button[aria-pressed="true"][data-s="ok"]{background:var(--green);border-color:var(--green);color:#fff}
.ans button[aria-pressed="true"][data-s="fix"]{background:var(--red);border-color:var(--red);color:#fff}
.ans button[aria-pressed="true"][data-s="unsure"]{background:var(--amber);border-color:var(--amber);color:#fff}
.qb label{font-size:12px;letter-spacing:.06em;color:var(--ink3)}
.qb textarea{width:100%;box-sizing:border-box;border:1px solid var(--rule);border-radius:8px;background:var(--field);padding:8px 10px;font-size:14.5px;resize:vertical;min-height:62px}
.mkc{margin:0;font-size:12.5px;color:var(--ink3)}
.legend{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:12px 16px}
.legend h3{margin:0 0 8px;font-size:13px;letter-spacing:.06em;color:var(--ink3);font-weight:500}
.legend ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px;font-size:13px;color:var(--ink2)}
.legend li{display:flex;align-items:center;gap:8px;min-width:0}
.legend svg{flex:none;width:34px;height:18px}
@media (max-width:900px){
  .wrap{grid-template-columns:minmax(0,1fr);flex:none}
  .board{height:68svh;min-height:380px}
  .panel{overflow:visible}
  .tabs{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top">
  <div>
    <h1>瑞北國小平面圖</h1>
    <p class="meta">依 3D 模型第三版畫的 · 尺寸是估計值 · 藍色編號是待確認的地方</p>
  </div>
  <nav class="tabs" role="tablist" aria-label="圖面" id="tabs"></nav>
</header>

<main class="wrap">
  <section class="board" aria-label="平面圖">
    <div class="sheet" id="sheet" data-tool="pan">
      <svg id="svg" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" role="img" aria-label="平面圖">
        <defs>
          <pattern id="hatch" patternUnits="userSpaceOnUse" width="5" height="5" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="5" class="hatchl"/></pattern>
        </defs>
        <style id="svgcss"></style>
        <rect id="bg" class="bgsheet" x="-5000" y="-5000" width="20000" height="20000"/>
        <g id="base"></g><g id="qlayer"></g><g id="marks"></g>
        <path id="live" class="mk" d=""/>
      </svg>
      <div class="tags" id="tags"></div>
      <div class="hint" id="hint">拖曳移動 · 滾輪或兩指縮放</div>
    </div>
    <div class="tools" role="toolbar" aria-label="畫圖工具">
      <div class="seg" id="toolSeg">
        <button data-tool="pan" aria-pressed="true" title="移動（V）">移動</button>
        <button data-tool="pen" aria-pressed="false" title="畫筆（P）">畫筆</button>
        <button data-tool="text" aria-pressed="false" title="文字（T）">文字</button>
        <button data-tool="erase" aria-pressed="false" title="擦掉（E）">擦掉</button>
      </div>
      <div class="sw" id="sw" aria-label="顏色">
        <button data-c="r" aria-pressed="true" title="紅"></button><button data-c="g" aria-pressed="false" title="綠"></button><button data-c="k" aria-pressed="false" title="黑"></button>
      </div>
      <button class="btn" id="undo" disabled title="復原（Ctrl+Z）">復原</button>
      <div class="seg"><button id="zin" title="放大" aria-label="放大">＋</button><button id="zout" title="縮小" aria-label="縮小">－</button><button id="zfit">全圖</button></div>
      <div class="seg" id="dl"><button id="dlPng">下載 PNG</button><button id="dlSvg">SVG</button></div>
      <span class="save" id="save" data-s="">連線中…</span>
    </div>
  </section>

  <aside class="panel" aria-label="待確認">
    <div class="intro">
      <h2>要跟你確認的地方</h2>
      <p>圖上的<b>藍色編號</b>是我不確定的地方。點一題，圖會移過去。按「要改，我畫給你」或選「畫筆」，直接在圖上畫；也可以在題目下面打字。畫的和打的都會自動存起來，我這邊讀得到。</p>
      <div class="prog"><span id="progT">0 / 0 已回覆</span><span class="bar"><i id="progB"></i></span></div>
      <div class="filters" id="filters"><button data-f="all" aria-pressed="true">全部</button><button data-f="todo" aria-pressed="false">還沒回的</button></div>
    </div>
    <ol class="qs" id="qs"></ol>
    <div class="legend">
      <h3>圖例</h3>
      <ul id="legend"></ul>
    </div>
  </aside>
</main>

<script>
(() => {
'use strict';
// ================= 校地座標 =================
// u：沿北側圍牆往東（公尺），v：往南（公尺）。原點＝校地西北角。和 3D 模型同一套座標。
const K = 10, r2 = n => Math.round(n * K * 100) / 100, esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const S = { V0: 2.0, VI: 2.25, V1: 12.2, V2: 15.0, UW: 13, UE: 77, PU: 26, PV: 21 };
const COLS = [26, 29.5, 32.7, 37.35, 42, 46.75, 51.5, 56.05, 60.6, 65.4, 70.2, 73.4, 77];
const STAIRS = [29.5, 70.2];
const NORTH_DEG = -13.7; // 紙面上北方往左偏約 14°

// ================= 繪圖小工具（輸出 SVG 字串，單位：公寸） =================
let O;
const reset = () => { O = { tint: [], grid: [], fur: [], thin: [], poche: [], line: [], sym: [], text: [], dim: [] }; };
const rect = (L, u0, v0, u1, v1, c, ex = '') => O[L].push(`<rect x="${r2(Math.min(u0, u1))}" y="${r2(Math.min(v0, v1))}" width="${r2(Math.abs(u1 - u0))}" height="${r2(Math.abs(v1 - v0))}" class="${c}"${ex}/>`);
const line = (L, u0, v0, u1, v1, c) => O[L].push(`<line x1="${r2(u0)}" y1="${r2(v0)}" x2="${r2(u1)}" y2="${r2(v1)}" class="${c}"/>`);
const P = (u, v) => `${r2(u)} ${r2(v)}`;
const path = (L, d, c) => O[L].push(`<path d="${d}" class="${c}"/>`);
const circ = (L, u, v, r, c) => O[L].push(`<circle cx="${r2(u)}" cy="${r2(v)}" r="${r2(r)}" class="${c}"/>`);
const text = (L, u, v, s, size, c, o = {}) => O[L].push(`<text x="${r2(u)}" y="${r2(v)}" font-size="${r2(size)}" class="${c}" text-anchor="${o.a || 'middle'}" dominant-baseline="central"${o.rot ? ` transform="rotate(${o.rot} ${r2(u)} ${r2(v)})"` : ''}>${esc(s)}</text>`);
const rrect = (L, u0, v0, u1, v1, rr, c) => O[L].push(`<rect x="${r2(u0)}" y="${r2(v0)}" width="${r2(u1 - u0)}" height="${r2(v1 - v0)}" rx="${r2(rr)}" class="${c}"/>`);

// 牆：dir 'H' 沿 u（厚度在 v 方向 c0..c1），'V' 沿 v（厚度在 u 方向）。ops：開口 {a,b,t}
function wall(dir, c0, c1, a0, a1, ops = []) {
  const M = (a, c) => dir === 'H' ? [a, c] : [c, a];
  const box = (a, b, ca, cb, L, cls) => { const p = M(a, ca), q = M(b, cb); rect(L, p[0], p[1], q[0], q[1], cls); };
  let cur = a0;
  for (const o of ops.slice().sort((x, y) => x.a - y.a)) { if (o.a > cur) box(cur, o.a, c0, c1, 'poche', 'pc'); opening(M, box, c0, c1, o); cur = Math.max(cur, o.b); }
  if (a1 > cur) box(cur, a1, c0, c1, 'poche', 'pc');
}
function opening(M, box, c0, c1, o) {
  const cm = (c0 + c1) / 2, w = o.b - o.a;
  if (o.t === 'win') { box(o.a, o.b, c0, c1, 'sym', 'win'); const p = M(o.a, cm), q = M(o.b, cm); line('sym', p[0], p[1], q[0], q[1], 'hl'); }
  else if (o.t === 'slide') { const t = Math.max(0.05, Math.min(0.07, (c1 - c0) / 3)); box(o.a, o.a + w * 0.56, cm - t, cm, 'sym', 'leaf'); box(o.b - w * 0.56, o.b, cm, cm + t, 'sym', 'leaf'); }
  else if (o.t === 'swing') swing(M, o.h === 'b' ? o.b : o.a, o.h === 'b' ? o.a : o.b, o.dir > 0 ? c1 : c0, o.dir, w);
  else if (o.t === 'dswing') { const m = (o.a + o.b) / 2, f = o.dir > 0 ? c1 : c0; swing(M, o.a, m, f, o.dir, w / 2); swing(M, o.b, m, f, o.dir, w / 2); }
}
function swing(M, ha, oa, face, dir, w) {
  const H = M(ha, face), E = M(ha, face + dir * w), J = M(oa, face);
  line('sym', H[0], H[1], E[0], E[1], 'leafl');
  let d = Math.atan2(J[1] - H[1], J[0] - H[0]) - Math.atan2(E[1] - H[1], E[0] - H[0]);
  while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI;
  path('sym', `M${P(E[0], E[1])}A${r2(w)} ${r2(w)} 0 0 ${d > 0 ? 1 : 0} ${P(J[0], J[1])}`, 'arc');
}
function arrow(L, u0, v0, u1, v1, c = 'arw') {
  const a = Math.atan2(v1 - v0, u1 - u0), h = 0.45, s = 0.28;
  path(L, `M${P(u0, v0)}L${P(u1, v1)}M${P(u1 - h * Math.cos(a) + s * Math.sin(a), v1 - h * Math.sin(a) - s * Math.cos(a))}L${P(u1, v1)}L${P(u1 - h * Math.cos(a) - s * Math.sin(a), v1 - h * Math.sin(a) + s * Math.cos(a))}`, c);
}
const label = (u, v, name, use, size = 1.25) => { text('text', u, v, name, size, 'tx'); if (use) text('text', u, v + size * 0.62 + 0.45, use, Math.min(0.78, size * 0.62), 'tu'); };

// ================= 家具與設備 =================
function stairs(s, fl) {
  const a0 = s + 0.1, am = s + 1.6, b1 = s + 3.1, top = 11.8, land = 8.44, l0 = 6.6;
  rect('fur', a0, l0, b1, land, 'fu');
  for (let k = 0; k <= 12; k++) { line('thin', a0, top - k * 0.28, am, top - k * 0.28, 'hl'); line('thin', am, land + k * 0.28, b1, land + k * 0.28, 'hl'); }
  rect('poche', am - 0.04, land, am + 0.04, top, 'pc');
  rect('tint', a0, S.VI, b1, l0, 'hatch'); rect('thin', a0, S.VI, b1, l0, 'hl');

  }, err => { done(); setSave('err'); });
}

// ================= 下載 =================
function exportSvg() {
  const b = VIEWS[view].box, x = b[0] * K, y = b[1] * K, w = (b[2] - b[0]) * K, h = (b[3] - b[1]) * K, pxm = 24;
  const W = Math.round(w / K * pxm), H = Math.round(h / K * pxm);
  return { W, H, str: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${x} ${y} ${w} ${h}" width="${W}" height="${H}"><defs><pattern id="hatch" patternUnits="userSpaceOnUse" width="5" height="5" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="5" class="hatchl"/></pattern><style>${svgCss('', k => LIGHT[k])}</style></defs><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#fbfcfb"/>${baseSvg(view)}</svg>` };
}
async function download(kind) {
  let dl = null; try { dl = await window.claude?.use?.('downloads'); } catch (e) {}
  if (!dl) { $('save').textContent = '這個畫面不能下載檔案'; return; }
  const { W, H, str } = exportSvg(), name = `瑞北國小_${VIEWS[view].name}平面圖`;
  try {
    if (kind === 'svg') { await dl.save({ filename: name + '.svg', data: new Blob([str], { type: 'image/svg+xml' }) }); return; }
    const url = URL.createObjectURL(new Blob([str], { type: 'image/svg+xml' })), img = new Image();
    await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H; const g = cv.getContext('2d'); g.fillStyle = '#fbfcfb'; g.fillRect(0, 0, W, H); g.drawImage(img, 0, 0, W, H); URL.revokeObjectURL(url);
    const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
    await dl.save({ filename: name + '.png', data: blob });
  } catch (err) { if (err && err.code !== 'declined') $('save').textContent = '下載沒有成功'; }
}

$('sw').addEventListener('click', e => { const b = e.target.closest('[data-c]'); if (!b) return; color = b.dataset.c; $('sw').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b))); if (tool === 'pan' || tool === 'erase') setTool('pen'); });
$('undo').addEventListener('click', () => { const id = mine[mine.length - 1]; if (id) delMark(id); });
$('zin').addEventListener('click', () => { const { w, h } = sz(); zoomAt(1 / 1.4, w / 2, h / 2); });
$('zout').addEventListener('click', () => { const { w, h } = sz(); zoomAt(1.4, w / 2, h / 2); });
$('zfit').addEventListener('click', () => goTo(fitBox(VIEWS[view].box, 0.01), true));
$('dlPng').addEventListener('click', () => download('png')); $('dlSvg').addEventListener('click', () => download('svg'));
$('filters').addEventListener('click', e => { const b = e.target.closest('[data-f]'); if (!b) return; filter = b.dataset.f; $('filters').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b))); renderList(); });
$('qs').addEventListener('click', e => {
  const li = e.target.closest('.q'); if (!li) return; const id = li.dataset.q;
  if (e.target.closest('.qh')) { selectQ(id); return; }
  const s = e.target.closest('.ans [data-s]');
  if (s && canWrite) { const cur = (answers.get(id) || {}).status; const ns = cur === s.dataset.s ? '' : s.dataset.s; setAnswer(id, { status: ns }); if (ns === 'fix') { if (activeQ !== id) selectQ(id); setTool('pen'); } return; }
  if (e.target.closest('[data-act="draw"]')) { activeQ = 'free'; renderList(); renderQLayer(); renderMarks(); setTool('pen'); }
});
const typing = {};
$('qs').addEventListener('input', e => { const ta = e.target.closest('textarea'); if (!ta) return; const id = ta.dataset.q; dirty[id] = true; clearTimeout(typing[id]); typing[id] = setTimeout(() => setAnswer(id, { text: ta.value.slice(0, 4000) }), 700); });
$('qs').addEventListener('focusout', e => { const ta = e.target.closest && e.target.closest('textarea'); if (!ta) return; const id = ta.dataset.q; if (dirty[id]) { clearTimeout(typing[id]); setAnswer(id, { text: ta.value.slice(0, 4000) }); } });
document.addEventListener('keydown', e => {
  if (e.target.closest('input,textarea')) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); $('undo').click(); return; }
  const t = { v: 'pan', p: 'pen', t: 'text', e: 'erase' }[e.key.toLowerCase()]; if (t && !e.ctrlKey && !e.metaKey && !e.altKey) setTool(t);
  if (e.key === '+' || e.key === '=') $('zin').click(); if (e.key === '-') $('zout').click(); if (e.key === '0') $('zfit').click();
});
