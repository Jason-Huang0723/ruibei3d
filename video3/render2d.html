// ---------- 共用 ----------
const cl = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));

// ---------- 5 快速複習 ----------
function P3(t) { const L = T.P3, V = L.vo; bg(t);
  txt('快速複習', W / 2, 105, 66, { a: ap(t, V['25']), gc: 'rgba(255,220,140,0.9)' });
  const rows = [
    { id: '26', y: 190, col: 'rgba(90,160,255,0.95)', parts: [['上課', '一、二、三年級教室', 0], ['哥姐休息', '四年級教室', 0.55]] },

  rows.forEach((R, ri) => { const t0 = V[R.id], d = L.d[R.id]; if (t < t0 - 0.05) return; const act = t < (ri < 3 ? V[rows[ri + 1].id] : 1e9), a = ap(t, t0);

// ---------- 7 回家路線（第三版：國土測繪中心正射影像，路線自己畫、一段一段長出來） ----------
const MAPW = 1458, MAPH = 1418, MS = 830 / MAPH, MX = 70, MY = 92; const mp = (x, y) => [MX + x * MS, MY + y * MS];

const RTL = {};

function route(k, frac, col, w, alpha, head) { frac = cl(frac); if (frac <= 0 || alpha <= 0) return; const P = window.ROUTES[k], d = routeLen(k), end = d[d.length - 1] * frac;

  if (head && frac < 1) { g.save(); g.globalAlpha = alpha; g.beginPath(); g.arc(hx, hy, w * 1.25, 0, 7); g.fillStyle = '#fff'; g.shadowColor = col; g.shadowBlur = 22; g.fill(); g.restore(); } }
function P5(t) { const L = T.P5, V = L.vo, D = L.d; bg(t);
