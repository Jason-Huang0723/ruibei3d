<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>瑞北 3D</title>
<style>
:root{ --bg:#10161c; --panel:rgba(16,22,28,.82); --ink:#f3f1ea; --ink-2:#b9c4cc; --line:rgba(255,255,255,.14); --accent:#e0a640; --chip:#1f2a33; --chip-on:#e0a640; --chip-on-ink:#1b1408; }
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
#view{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;left:0;top:0;transform:translate(-50%,-100%);white-space:nowrap;font-size:13px;font-weight:700;color:#fff;background:rgba(20,28,36,.8);border:1px solid rgba(255,255,255,.25);padding:3px 8px;border-radius:8px;transition:opacity .25s;will-change:transform}
.lb::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:16px;background:rgba(255,255,255,.85);transform:translateX(-50%)}
.lb.big{font-size:15px;background:rgba(150,60,40,.88)}
header{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 10px) 16px 8px;background:linear-gradient(var(--panel),rgba(16,22,28,0));pointer-events:none}
header h1{margin:0;font-size:18px;letter-spacing:.02em}
header p{margin:2px 0 0;font-size:12px;color:var(--ink-2)}
#bar{position:fixed;left:0;right:0;bottom:0;padding:8px 12px calc(env(safe-area-inset-bottom) + 8px);background:var(--panel);border-top:1px solid var(--line);backdrop-filter:blur(6px)}
#presets{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:6px}
#presets::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--chip);color:var(--ink);font:inherit;font-size:13px;padding:7px 12px;border-radius:999px;cursor:pointer}
.chip.on{background:var(--chip-on);color:var(--chip-on-ink);border-color:var(--chip-on)}
#tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#tools .chip{font-size:12px;padding:6px 10px}
#credit{font-size:10.5px;color:var(--ink-2);margin-left:auto;text-align:right;line-height:1.35}
#loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:var(--bg);z-index:10;padding:16px;text-align:center}
#loading .t{font-size:20px;font-weight:700}
#loading .s{font-size:13px;color:var(--ink-2);min-height:1.4em}
#prog{width:min(320px,80vw);height:6px;background:#26313a;border-radius:3px;overflow:hidden}
#prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
#exp{position:fixed;right:12px;top:64px;width:min(300px,calc(100vw - 24px));background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:13px;display:none;z-index:5}
#exp h3{margin:0 0 8px;font-size:14px}
#exp label{display:flex;align-items:center;gap:6px;margin:4px 0}
#exp select,#exp button{font:inherit;font-size:13px}
#exp .msg{color:var(--ink-2);margin-top:8px;min-height:1.3em}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<canvas id="view"></canvas>
<div id="labels"></div>
<header><h1>瑞北國小・瑞北社區 3D</h1><p>拖曳旋轉・雙指縮放・點下方按鈕移動到各地點</p></header>
<div id="bar">
  <div id="presets"></div>
  <div id="tools">
    <button class="chip" id="tour">▶ 播放導覽</button>
    <button class="chip on" id="lbl">標籤</button>
    <button class="chip" id="expBtn">匯出影片</button>
    <div id="credit">影像、建物框：內政部國土測繪中心｜道路：© OpenStreetMap 貢獻者｜地形：Mapzen Terrain Tiles</div>
  </div>
</div>
<div id="exp">
  <h3>匯出影片（1920×1080 MP4）</h3>
  <label>鏡頭 <select id="expShot"></select></label>
  <label><input type="checkbox" id="expLbl" checked> 加上標籤與標題</label>
  <button class="chip" id="expGo">開始匯出</button> <button class="chip" id="expClose">關閉</button>
  <div class="msg" id="expMsg">需要電腦版 Chrome／Edge。每段約 1–2 分鐘，完成後自動下載。</div>
</div>
<div id="loading"><div class="t">瑞北 3D 載入中</div><div id="prog"><i></i></div><div class="s" id="ls">準備中…</div></div>

const v3 = new THREE.Vector3();

    if (a > 0.01) { v3.set(...L.pos).project(cam); if (v3.z > 1 || v3.z < -1) a = 0; } d.style.opacity = a; if (a > 0.01) { const lift = L.lift !== undefined ? L.lift * H : 18; d.style.transform = `translate(${(v3.x * 0.5 + 0.5) * W}px, ${(-v3.y * 0.5 + 0.5) * H - lift}px) translate(-50%,-100%)`; } } }
const freeLabels = () => setLabels(RB.FREE_LABELS.map(([text, pos, max, min, big, alt]) => ({ text, pos, max, min, big, alt })));
function setCam(p, l, fov) { cam.position.set(...p); controls.target.set(...l); cam.fov = fov || 50; cam.updateProjectionMatrix(); }
function flyTo(shot) { tour = null; const k = shot.keys[shot.keys.length - 1]; fly = { t0: performance.now(), p0: cam.position.toArray(), l0: controls.target.toArray(), f0: cam.fov, p1: k.p, l1: k.l, f1: k.fov || 50 }; freeLabels(); }
function startTour() { fly = null; document.querySelectorAll('#presets .chip').forEach(c => c.classList.remove('on')); tour = { i: 0, t0: performance.now() }; setLabels(RB.SHOTS[RB.ORDER[0]].labels); document.getElementById('tour').classList.add('on'); }
function stopTour() { tour = null; document.getElementById('tour').classList.remove('on'); freeLabels(); }
function frame(now) { requestAnimationFrame(frame); if (exporting) return; let t = 0;
  if (fly) { let u = Math.min(1, (now - fly.t0) / 2200); const e = u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2; const lerp = (a, b) => a.map((x, i) => x + (b[i] - x) * e); setCam(lerp(fly.p0, fly.p1), lerp(fly.l0, fly.l1), fly.f0 + (fly.f1 - fly.f0) * e); if (u >= 1) fly = null; dirty = true; }
  else if (tour) { const sh = RB.SHOTS[RB.ORDER[tour.i]]; t = (now - tour.t0) / 1000; if (t > sh.dur) { tour.i++; tour.t0 = now; if (tour.i >= RB.ORDER.length) { stopTour(); return; } setLabels(RB.SHOTS[RB.ORDER[tour.i]].labels); t = 0; } const k = RB.pathAt(RB.SHOTS[RB.ORDER[tour.i]].keys, t); setCam(k.p, k.l, k.fov); dirty = true; }
  else controls.update();
  // 不讓鏡頭鑽進地面
  const gy = RB.H ? RB.H(cam.position.x, -cam.position.z) + 1.5 : -1e9; if (cam.position.y < gy) { cam.position.y = gy; dirty = true; }
  if (!dirty) return; dirty = false;
  RB.sky.position.copy(cam.position); RB.sky.scale.setScalar(50000);
  const dist = cam.position.distanceTo(controls.target); RB.setShadowFocus(controls.target.x, controls.target.z, Math.max(90, Math.min(1500, dist * 0.9)));
  renderer.render(RB.scene, cam); updateLabels(t); }

/* ================= 10. 匯出影片（電腦版 Chrome/Edge） ================= */
async function exportShots(keys, withLabels, msg) {
  if (typeof VideoEncoder === 'undefined') { msg('這個瀏覽器不支援匯出，請用電腦版 Chrome 或 Edge。'); return; }
  const { Muxer, ArrayBufferTarget } = await import('https://cdn.jsdelivr.net/npm/mp4-muxer@5/+esm');
  exporting = true; const W = 1920, H = 1080, fps = 30; renderer.setPixelRatio(1); renderer.setSize(W, H, false); cam.aspect = W / H; cam.updateProjectionMatrix(); labelBox.style.display = 'none';
  const comp = new OffscreenCanvas(W, H), cg = comp.getContext('2d');
  try { for (const key of keys) { const shot = RB.SHOTS[key], target = new ArrayBufferTarget(), mux = new Muxer({ target, video: { codec: 'avc', width: W, height: H }, fastStart: 'in-memory' }); let err = null;
      const enc = new VideoEncoder({ output: (c, m) => mux.addVideoChunk(c, m), error: e => err = e }); enc.configure({ codec: 'avc1.640028', width: W, height: H, bitrate: 16e6, framerate: fps, latencyMode: 'quality' });
      const N = Math.round(shot.dur * fps);
      for (let i = 0; i < N; i++) { const t = i / fps, k = RB.pathAt(shot.keys, t); cam.position.set(...k.p); cam.lookAt(...k.l); cam.fov = k.fov; cam.updateProjectionMatrix(); RB.sky.position.copy(cam.position); RB.sky.scale.setScalar(50000);
        RB.setShadowFocus(k.l[0], k.l[2], Math.max(90, Math.min(1500, Math.hypot(k.p[0] - k.l[0], k.p[1] - k.l[1], k.p[2] - k.l[2]) * 0.9))); renderer.render(RB.scene, cam);
        cg.drawImage(canvas, 0, 0, W, H); if (withLabels) { RB.drawLabels(cg, cam, shot.labels || [], t, W, H); RB.drawTitle(cg, shot, t, W, H); }
        const fr = new VideoFrame(comp, { timestamp: Math.round(i * 1e6 / fps), duration: Math.round(1e6 / fps) }); enc.encode(fr, { keyFrame: i % (fps * 2) === 0 }); fr.close(); if (err) throw err;
        while (enc.encodeQueueSize > 4) await new Promise(r => setTimeout(r, 5)); if (i % 10 === 0) { msg(`${shot.name}：${Math.round(i / N * 100)}%`); await new Promise(r => setTimeout(r, 0)); } }
      await enc.flush(); mux.finalize(); const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([target.buffer], { type: 'video/mp4' })); a.download = `瑞北3D_${String(RB.ORDER.indexOf(key) + 1).padStart(2, '0')}_${shot.name}${withLabels ? '' : '_無標籤'}.mp4`; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 60000); }
    msg('完成，影片已下載。'); }
  catch (e) { msg('匯出失敗：' + e.message); }
  finally { exporting = false; renderer.setPixelRatio(Math.min(devicePixelRatio, RB.LOW ? 1.5 : 2)); renderer.setSize(innerWidth, innerHeight, false); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); labelBox.style.display = ''; dirty = true; }
}

/* ================= 11. 啟動 ================= */
(async () => {
  try {
    st('讀取地形', 0.05); await RB.buildHeights();
    st('讀取道路', 0.2); await RB.loadOSM();
    await RB.loadOrtho(st);
    st('描出房屋輪廓', 0.62); await RB.loadBuildings(st);
    await RB.buildScene(st); RB.makeShots();
    const pre = document.getElementById('presets'), sel = document.getElementById('expShot');
    for (const key of RB.ORDER) { const sh = RB.SHOTS[key]; if (key === 's9_out') continue; const b = document.createElement('button'); b.className = 'chip'; b.textContent = sh.name; b.onclick = () => { stopTour(); [...pre.children].forEach(c => c.classList.remove('on')); b.classList.add('on'); flyTo(sh); }; pre.appendChild(b); }
    sel.innerHTML = '<option value="all">全部（9 段）</option>' + RB.ORDER.map(k => `<option value="${k}">${RB.SHOTS[k].name}</option>`).join('');
    document.getElementById('tour').onclick = () => tour ? stopTour() : startTour();
    document.getElementById('lbl').onclick = e => { showLabels = !showLabels; e.target.classList.toggle('on', showLabels); dirty = true; };
    const exp = document.getElementById('exp'), msg = s => document.getElementById('expMsg').textContent = s;
    document.getElementById('expBtn').onclick = () => { exp.style.display = exp.style.display === 'block' ? 'none' : 'block'; };
    document.getElementById('expClose').onclick = () => exp.style.display = 'none';
    document.getElementById('expGo').onclick = () => { if (exporting) return; stopTour(); const v = sel.value; exportShots(v === 'all' ? RB.ORDER : [v], document.getElementById('expLbl').checked, msg); };
    const k = RB.SHOTS.s4_campus.keys[0]; setCam(k.p, k.l, k.fov); freeLabels();
    document.getElementById('loading').remove(); requestAnimationFrame(frame);
  } catch (e) { st('載入失敗：' + e.message + '（請確認網路，或重新整理）'); console.error(e); }
})();
</script>
